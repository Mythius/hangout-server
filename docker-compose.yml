services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # DATABASE_URL is no longer overridden here — it comes from .env,
      # pointing at the Postgres instance running on the host machine.
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      # Docker on Linux doesn't auto-add this mapping the way Docker
      # Desktop (Mac/Windows) does, so it's added explicitly here.
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:80"
    volumes:
      # Bind-mounted so files (e.g. a built APK) can be dropped in and served
      # immediately, without needing to rebuild the image.
      - ./public:/app/public
      # Secrets (e.g. the Firebase service account key) live only on the
      # host — never baked into the image or committed to git.
      - ./secrets:/app/secrets
      # User uploads (profile pictures) — bind-mounted so they survive an
      # image rebuild, which would otherwise wipe them with the container.
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Test-only Postgres container — disabled now that the app connects to a
  # Postgres instance on the host machine via DATABASE_URL in .env.
  # db:
  #   image: postgres:latest
  #   environment:
  #     - POSTGRES_USER=test
  #     - POSTGRES_PASSWORD=test
  #     - POSTGRES_DB=test_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: always

volumes:
  # postgres_data: — unused now that the db service is disabled
  redis_data:

